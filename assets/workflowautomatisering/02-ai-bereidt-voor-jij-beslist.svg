<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#163f2b" flood-opacity=".10"/></filter></defs>
<rect width="1600" height="1000" fill="#fffaf1"/><circle cx="124" cy="86" r="16" fill="#d7f268"/><text x="154" y="99" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#10291c">ZZPagent</text>
<rect x="1130" y="55" width="330" height="54" rx="27" fill="#eef5cf"/><text x="1295" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#143f2b">MENSELIJKE CONTROLE</text>
<text x="110" y="215" font-family="Arial,sans-serif" font-size="76" font-weight="850" letter-spacing="-2" fill="#111a12">AI bereidt voor. Jij beslist.</text>
<text x="110" y="274" font-family="Arial,sans-serif" font-size="30" fill="#526057">Niet alles uit handen geven, maar het voorbereidende werk slim verdelen.</text>
<g filter="url(#shadow)"><rect x="110" y="350" width="650" height="460" rx="38" fill="#143f2b"/><rect x="840" y="350" width="650" height="460" rx="38" fill="#ffffff" stroke="#c8d9cb" stroke-width="2"/></g>
<circle cx="185" cy="425" r="35" fill="#d7f268"/><text x="185" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#143f2b">H</text>
<text x="245" y="438" font-family="Arial,sans-serif" font-size="40" font-weight="850" fill="#fffaf1">Hermes bereidt voor</text>
<g font-family="Arial,sans-serif" font-size="29" fill="#f5f1e8"><circle cx="175" cy="525" r="8" fill="#d7f268"/><text x="205" y="535">verzamelt afgesproken informatie</text><circle cx="175" cy="605" r="8" fill="#d7f268"/><text x="205" y="615">ordent en signaleert wat aandacht vraagt</text><circle cx="175" cy="685" r="8" fill="#d7f268"/><text x="205" y="695">maakt een briefing, concept of voorstel</text></g>
<circle cx="915" cy="425" r="35" fill="#d7f268"/><text x="915" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#143f2b">J</text>
<text x="975" y="438" font-family="Arial,sans-serif" font-size="40" font-weight="850" fill="#143f2b">Jij houdt de regie</text>
<g font-family="Arial,sans-serif" font-size="29" fill="#26342b"><circle cx="905" cy="525" r="8" fill="#143f2b"/><text x="935" y="535">voegt context, toon en oordeel toe</text><circle cx="905" cy="605" r="8" fill="#143f2b"/><text x="935" y="615">controleert en past het resultaat aan</text><circle cx="905" cy="685" r="8" fill="#143f2b"/><text x="935" y="695">beslist wat wordt verzonden of uitgevoerd</text></g>
<rect x="245" y="850" width="1110" height="86" rx="28" fill="#eef5cf"/><text x="800" y="904" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#143f2b">Menselijke controle is geen rem, maar een bewuste ontwerpkeuze.</text>
</svg>