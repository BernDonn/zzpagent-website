<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2b6a4a"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#163f2b" flood-opacity=".09"/></filter></defs>
<rect width="1600" height="1000" fill="#fffaf1"/><circle cx="124" cy="86" r="16" fill="#d7f268"/><text x="154" y="99" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#10291c">ZZPagent</text>
<rect x="1190" y="55" width="270" height="54" rx="27" fill="#eef5cf"/><text x="1325" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#143f2b">PRAKTIJKVOORBEELD</text>
<text x="110" y="205" font-family="Arial,sans-serif" font-size="70" font-weight="850" letter-spacing="-2" fill="#111a12">Eén opdracht, een rustig dagoverzicht</text>
<text x="110" y="260" font-family="Arial,sans-serif" font-size="29" fill="#526057">Hermes brengt verspreide informatie samen en zet alleen het relevante voor je klaar.</text>
<g filter="url(#shadow)" font-family="Arial,sans-serif">
<rect x="90" y="335" width="330" height="110" rx="24" fill="#e5f4e8"/><text x="125" y="380" font-size="28" font-weight="800" fill="#143f2b">Belangrijke mail</text><text x="125" y="417" font-size="22" fill="#526057">Wie wacht op antwoord?</text>
<rect x="90" y="475" width="330" height="110" rx="24" fill="#fff0c9"/><text x="125" y="520" font-size="28" font-weight="800" fill="#143f2b">Taken en deadlines</text><text x="125" y="557" font-size="22" fill="#526057">Wat moet vandaag?</text>
<rect x="90" y="615" width="330" height="110" rx="24" fill="#e8eefb"/><text x="125" y="660" font-size="28" font-weight="800" fill="#143f2b">Agenda</text><text x="125" y="697" font-size="22" fill="#526057">Afspraken en voorbereiding</text>
<rect x="90" y="755" width="330" height="110" rx="24" fill="#e6f5f4"/><text x="125" y="800" font-size="28" font-weight="800" fill="#143f2b">Notities en acties</text><text x="125" y="837" font-size="22" fill="#526057">Wat staat nog open?</text>
<rect x="560" y="420" width="480" height="360" rx="40" fill="#143f2b"/><rect x="665" y="460" width="270" height="54" rx="27" fill="#d7f268"/><text x="800" y="496" text-anchor="middle" font-size="24" font-weight="900" fill="#143f2b">/OCHTEND</text><text x="800" y="570" text-anchor="middle" font-size="38" font-weight="850" fill="#fffaf1">Hermes selecteert</text><text x="800" y="620" text-anchor="middle" font-size="26" fill="#e7eee8">wat vandaag aandacht vraagt</text><text x="800" y="675" text-anchor="middle" font-size="26" fill="#e7eee8">ordent op urgentie</text><text x="800" y="730" text-anchor="middle" font-size="26" fill="#e7eee8">en maakt concepten klaar</text>
<rect x="1180" y="385" width="330" height="130" rx="26" fill="#ffffff" stroke="#bdd4c4" stroke-width="2"/><text x="1215" y="435" font-size="28" font-weight="800" fill="#143f2b">Dagbriefing</text><text x="1215" y="475" font-size="22" fill="#526057">Kort en leesbaar op mobiel</text>
<rect x="1180" y="565" width="330" height="130" rx="26" fill="#ffffff" stroke="#bdd4c4" stroke-width="2"/><text x="1215" y="615" font-size="28" font-weight="800" fill="#143f2b">Concepten klaar</text><text x="1215" y="655" font-size="22" fill="#526057">Nog niets is verzonden</text>
<rect x="1180" y="745" width="330" height="130" rx="26" fill="#ffffff" stroke="#bdd4c4" stroke-width="2"/><text x="1215" y="795" font-size="28" font-weight="800" fill="#143f2b">Dagoverzicht</text><text x="1215" y="835" font-size="22" fill="#526057">Bewaard als naslag</text>
</g>
